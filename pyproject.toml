[project]
name = "image-tool"
version = "0.1.0"
description = "A simple command-line image processing tool based on OpenCV"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
